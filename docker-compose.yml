services:
  api1:
    build: ./api
    environment:
      - MESSAGE=${MESSAGE}
      - PORT=3000
    ports:
      - "${API1_PORT}:3000"
    volumes:
      - api_logs:/app/logs
    networks:
      - frontend
      - backend
    depends_on:
      - db

  api2:
    build: ./api
    environment:
      - MESSAGE=${MESSAGE}
      - PORT=3000
    ports:
      - "${API2_PORT}:3000"
    volumes:
      - api_logs:/app/logs
    networks:
      - frontend
      - backend
    depends_on:
      - db

  api3:
    build: ./api
    environment:
      - MESSAGE=${MESSAGE}
      - PORT=3000
    ports:
      - "${API3_PORT}:3000"
    volumes:
      - api_logs:/app/logs
    networks:
      - frontend
      - backend
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db_data:
  api_logs: